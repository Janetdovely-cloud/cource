name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每週一台灣時間 09:00 抓取最新學員作品並重新部署
  schedule:
    - cron: '0 1 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 抓取最新學員作品
        run: npm run works
        continue-on-error: true
      - name: 抓取最新就業影片
        run: npm run videos
        continue-on-error: true
      - name: 抓取近期開班
        run: npm run classes
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 產生手寫字型子集（收錄網站所有用字）
        run: pip install fonttools brotli && npm run font
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
