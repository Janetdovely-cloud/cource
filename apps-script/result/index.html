<!doctype html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #FBF6EA; color: #2B2822; font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  .page { max-width: 760px; margin: 0 auto; padding: 16px; }
  .msg { text-align: center; color: #6B645A; padding: 48px 0; }
  .out img { width: 100%; display: block; border-radius: 12px; border: 2px solid #2B2822; }
  .tip { text-align: center; color: #6B645A; font-size: 14px; margin: 10px 0 0; }
  /* 截圖用的結果卡（畫在畫面外） */
  #stage { position: fixed; left: -10000px; top: 0; width: 720px; }
  #card { background: #FBF6EA; padding: 28px; }
  .brand { font-weight: 900; font-size: 22px; letter-spacing: .08em; margin: 0 0 16px; }
  .brand span { color: #11806F; }
  .box { background: #FFFDF8; border: 2px dashed #1DAD97; border-left: 6px solid #1DAD97; border-radius: 14px; padding: 22px 24px; }
  .label { color: #11806F; font-weight: 900; font-size: 15px; margin: 0; }
  .big { font-weight: 900; font-size: 30px; margin: 4px 0 8px; }
  .code { font-family: ui-monospace, Menlo, monospace; font-weight: 900; font-size: 46px; line-height: 1; margin: 6px 0 12px; }
  .row { display: flex; gap: 22px; align-items: center; }
  .bar { display: grid; grid-template-columns: 96px 1fr 30px; gap: 10px; align-items: center; font-size: 15px; margin: 8px 0; }
  .bar b { white-space: nowrap; }
  .track { height: 14px; border: 2px solid #2B2822; border-radius: 99px; background: #FBF6EA; overflow: hidden; }
  .track i { display: block; height: 100%; }
  .num { text-align: right; font-family: ui-monospace, Menlo, monospace; }
  .top { padding-left: 12px; margin: 10px 0; }
  .top p { margin: 0; }
  .top .t { font-weight: 900; }
  .top .d { color: #6B645A; font-size: 14px; }
  .sub { font-weight: 900; font-size: 20px; margin: 22px 0 4px; }
  .why { color: #6B645A; font-size: 14px; margin: 0 0 12px; }
  .courses { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .course { background: #FFFDF8; border: 2px dashed #1DAD97; border-left: 5px solid #F2B134; border-radius: 12px; padding: 12px 14px; }
  .course .en { color: #11806F; font-size: 12px; margin: 0; }
  .course .n { font-weight: 900; font-size: 17px; margin: 2px 0 4px; }
  .course .l { color: #6B645A; font-size: 13px; margin: 0; }
</style>
</head>
<body>
<div class="page">
  <div id="out" class="out"><p class="msg">結果圖片產生中…</p></div>
</div>
<div id="stage"><div id="card"></div></div>

<script>

const D = {"types":{"D":{"name":"支配型","animal":"老虎","desc":"具備主動且任務導向的特質。","c":"#EF5D60"},"I":{"name":"影響型","animal":"孔雀","desc":"具備主動且人際導向的特質。","c":"#F2B134"},"S":{"name":"穩健型","animal":"無尾熊","desc":"具備內斂且人際導向的特質。","c":"#1DAD97"},"C":{"name":"分析型","animal":"貓頭鷹","desc":"具備內斂且任務導向的特質。","c":"#8B7CF6"}},"REC":{"D":{"why":"果斷、重目標，適合規劃系統與帶領專案的方向","slugs":["ai-agent","cloud","ipas"]},"I":{"why":"表達力強、富創意，適合需要溝通與創作的方向","slugs":["av-design","biz-design","anime","ai-game"]},"S":{"why":"穩定細心、重協作，適合按部就班累積專業的方向","slugs":["interior","interior-b","ptc","ai-pro"]},"C":{"why":"邏輯嚴謹、重精確，適合程式分析與資安的方向","slugs":["infosec","java","ai-engineer"]}},"HOLLAND":[{"k":"R","name":"實踐者","c":"#E8743B","cats":["mech","space","cloud"],"desc":"重視實際與動手做，喜歡操作工具、機械與設備，偏好具體明確的工作。","job":"機械電子、農林漁牧、運動或建築工程等領域"},{"k":"I","name":"思考者","c":"#3FA796","cats":["code","ai","sec"],"desc":"好奇心強、重視分析，喜歡觀察、思考與研究，透過邏輯解決複雜問題。","job":"理工、生醫或人文科學等領域"},{"k":"A","name":"創造者","c":"#D99A00","cats":["design","video","game"],"desc":"富想像力與創造力，喜歡自由表達與創新，重視美感與個人風格。","job":"藝術、設計、影音創作等領域"},{"k":"S","name":"助人者","c":"#4A6FA5","cats":["biz"],"desc":"友善且樂於助人，喜歡與人互動、教導與協助他人，重視人際關係。","job":"教育、社工心理、醫護、客服等領域"},{"k":"E","name":"影響者","c":"#4E9F4E","cats":["biz","video","ai"],"desc":"自信有企圖心，喜歡領導、說服與競爭，追求影響力與成就。","job":"企管領導、行銷企劃、法律政治等領域"},{"k":"C","name":"組織者","c":"#B03A6A","cats":["sec","cloud","ai"],"desc":"重視秩序與規則，做事細心有條理，偏好結構清楚、流程明確的工作。","job":"財務金融、特助秘書、會計、行政等領域"}],"CAT":{"ai":{"name":"AI 應用","slugs":["ai-pro","ai-agent"]},"code":{"name":"程式開發","slugs":["ai-engineer","java"]},"cloud":{"name":"雲端系統","slugs":["cloud"]},"sec":{"name":"資訊安全","slugs":["infosec"]},"video":{"name":"影音創作","slugs":["av-design"]},"design":{"name":"視覺設計","slugs":["biz-design"]},"game":{"name":"遊戲與動漫","slugs":["ai-game","anime"]},"mech":{"name":"工程製圖","slugs":["ptc"]},"space":{"name":"室內設計","slugs":["interior","interior-b"]},"biz":{"name":"商業管理","slugs":["ipas"]}},"COURSES":{"ai-pro":{"name":"AI 熟練師","en":"AI Skills Specialist","line":"AI 已成職場標配，10 張證照對準企業選才新標準"},"biz-design":{"name":"商業整合設計師","en":"Branding Marketing Designer","line":"商業設計 × 品牌行銷 × AI 工具，啟動商業整合新風潮"},"av-design":{"name":"影音製作設計師","en":"Audiovisual Production Designer","line":"影片剪輯 × 動畫特效 × AI 輔助，創造流量拼收益"},"interior":{"name":"室內設計師","en":"Interior Designer","line":"善用 AI 協作，挑戰 6 個月取得乙級證照，合法執業"},"ai-engineer":{"name":"AI 人工智慧工程師","en":"Artificial Intelligence Engineer","line":"掌握 Python × AI 開發技術，打造善用 AI 的工程實力"},"ai-agent":{"name":"AI Agent 應用開發工程師","en":"AI Agent Application Development Engineer","line":"從 Python 開發到 LLM 工作流建構，打造可上線 AI 系統"},"ptc":{"name":"PTC 機構工程師","en":"PTC Mechanical Engineer","line":"透過 AI 運算輔助，用設計「智」造未來，取得研發硬實力"},"infosec":{"name":"資訊安全工程師","en":"Information Security Engineer","line":"資安分析 × 攻防實戰 × 國際證照，一站養成企業最搶手新星"},"java":{"name":"Java 軟體工程師","en":"Java Engineer","line":"不只會寫 Code，從 Java 到 AI 工作流，練出專案解題力"},"cloud":{"name":"雲端系統整合工程師","en":"Cloud System Administrator","line":"讓 AI 上雲協助企業轉型，擁抱百億雲端運算產業"},"anime":{"name":"動漫角色設計師","en":"Animation Character Designer","line":"從 AI 生成到原創角色，你也能創造超級 IP"},"ai-game":{"name":"AI 遊戲程式設計師","en":"AI Game Programmer","line":"掌握遊戲程式 × AI 整合技術，打造新世代遊戲開發實力"},"ipas":{"name":"iPAS 永續科技人才證照班","en":"iPAS Certification","line":"AI 應用 × 資訊安全 × 淨零碳，初級＋中級一次備戰"},"interior-b":{"name":"室內設計雙乙級班","en":"Level B Technician","line":"室內設計 12500 × 裝修工程管理 12600，合法執業雙證照"}}};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const courseCards = (slugs) => '<div class="courses">' + slugs.filter((s) => D.COURSES[s]).map((s) => {
  const c = D.COURSES[s]
  return `<div class="course"><p class="en">${esc(c.en)}</p><p class="n">${esc(c.name)}</p><p class="l">${esc(c.line)}</p></div>`
}).join('') + '</div>'

function disc(v) {
  if (v.length !== 4 || !v.every((n) => n >= 0 && n <= 18)) return ''
  const s = { D: v[0], I: v[1], S: v[2], C: v[3] }, max = Math.max(...v)
  const top = Object.keys(s).filter((k) => s[k] === max), T = D.types
  const slugs = [...new Set(top.flatMap((k) => D.REC[k].slugs))]
  return `<div class="box" style="border-left-color:${T[top[0]].c}">
    <p class="label">你的主要風格</p>
    <p class="big">${top.map((k) => `${k} ${T[k].name}`).join('／')}</p>
    <p style="margin:0 0 10px">${top.length === 1 ? `你偏向「${T[top[0]].name}（${T[top[0]].animal}）」，${T[top[0]].desc}` : '你屬於跨界混合型，同時具備多重優勢特質。'}</p>
    ${Object.entries(s).map(([k, n]) => `<div class="bar"><b>${k} ${T[k].name}</b><div class="track"><i style="width:${(n / 18) * 100}%;background:${T[k].c}"></i></div><span class="num">${n}</span></div>`).join('')}
    <p class="sub">推薦你優先了解的課程</p>
    <p class="why">${top.map((k) => esc(D.REC[k].why)).join('；')}</p>
    ${courseCards(slugs)}
  </div>`
}

function radar(s) {
  const cx = 130, cy = 125, R = 82, n = 6
  const pt = (i, r) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)] }
  let g = ''
  for (const l of [5, 4, 3, 2, 1]) g += `<polygon points="${[...Array(n)].map((_, i) => pt(i, (R * l) / 5).join(',')).join(' ')}" fill="${l % 2 ? '#F4EEDF' : '#FFFDF8'}" stroke="#E2D8C5"/>`
  g += `<polygon points="${D.HOLLAND.map((h, i) => pt(i, (R * s[h.k]) / 10).join(',')).join(' ')}" fill="rgba(29,173,151,.22)" stroke="#1DAD97" stroke-width="2.5" stroke-linejoin="round"/>`
  D.HOLLAND.forEach((h, i) => { const [x, y] = pt(i, R + 20); g += `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="12" font-weight="900" fill="${h.c}">${h.k} ${h.name} ${s[h.k]}</text>` })
  return `<svg viewBox="0 0 260 255" width="260" height="255" xmlns="http://www.w3.org/2000/svg">${g}</svg>`
}

function interest(v) {
  if (v.length !== 6 || !v.every((n) => n >= 0 && n <= 10)) return ''
  const s = {}; D.HOLLAND.forEach((h, i) => { s[h.k] = v[i] })
  const top = D.HOLLAND.map((h) => ({ ...h, v: s[h.k] })).filter((h) => h.v > 0).sort((a, b) => b.v - a.v).slice(0, 3)
  const w = {}; top.forEach((h, n) => h.cats.forEach((c) => { w[c] = (w[c] || 0) + (3 - n) }))
  const cats = Object.entries(w).sort((a, b) => b[1] - a[1]).map((x) => x[0]).slice(0, 3)
  const slugs = [...new Set(cats.flatMap((c) => D.CAT[c].slugs))]
  return `<div class="box"><div class="row">${radar(s)}<div style="flex:1">
      <p class="label">你的興趣代碼</p>
      <p class="code">${top.map((h) => `<span style="color:${h.c}">${h.k}</span>`).join('')}</p>
      ${top.map((h, n) => `<div class="top" style="border-left:4px solid ${h.c}"><p class="t">${['①', '②', '③'][n]} ${esc(h.name)}（${h.v} 分）</p><p class="d">${esc(h.desc)}</p><p class="d">典型職業：${esc(h.job)}</p></div>`).join('')}
    </div></div></div>
    <p class="sub">推薦你優先了解的課程</p>
    <p class="why">推薦方向：${cats.map((c) => esc(D.CAT[c].name)).join('、')}</p>
    ${courseCards(slugs)}`
}

const v = P.r.split('-').map(Number)
const body = P.t === 'disc' ? disc(v) : P.t === 'interest' ? interest(v) : ''
const out = document.getElementById('out')
if (!body) out.innerHTML = '<p class="msg">找不到測驗結果，請重新掃描 QR Code。</p>'
else {
  const card = document.getElementById('card')
  card.innerHTML = `<p class="brand">聯成電腦<span>｜${P.t === 'disc' ? 'DISC 職涯適性測驗' : '職涯興趣測驗'}結果</span></p>` + body
  htmlToImage.toPng(card, { pixelRatio: 2, backgroundColor: '#FBF6EA' }).then((src) => {
    out.innerHTML = `<img src="${src}" alt="測驗結果"><p class="tip">長按圖片即可儲存到手機</p>`
    document.getElementById('stage').remove()
  }).catch(() => { out.innerHTML = '<p class="msg">圖片產生失敗，請重新整理再試一次。</p>' })
}
